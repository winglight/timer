<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6fbf9">
<meta name="description" content="跟随呼吸的节奏，回到当下。">
<title>呼吸 · 回到当下</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23eef6f1'/%3E%3Cpath d='M9 37C19 37 17 17 26 17S34 47 43 47C50 47 49 36 56 36' fill='none' stroke='%235c9e91' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="r2-config.css">
</head>
<body data-status="idle">
<svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
  <symbol id="i-settings" viewBox="0 0 24 24"><path d="M5 3v5m0 4v9M12 3v11m0 4v3M19 3v3m0 4v11"/><path d="M2 8h6v4H2zM9 14h6v4H9zM16 6h6v4h-6z"/></symbol>
  <symbol id="i-reset" viewBox="0 0 24 24"><path d="M4.5 9A8 8 0 1 1 4 14M4.5 4v5H10"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path d="m14.5 5-7 7 7 7"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="m9.5 5 7 7-7 7"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7Z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1" fill="currentColor" stroke="none"/><rect x="14" y="4" width="4" height="16" rx="1" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M19 3C9 3 4 7 4 13a6 6 0 0 0 6 6c6 0 10-6 9-16Z"/><path d="M4 21 15 9m-6 7v-5m1 4h5"/></symbol>
  <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3v4m8-4v4M4 10h16m-11 4h1m4 0h1m-6 3h1"/></symbol>
  <symbol id="i-bars" viewBox="0 0 24 24"><path d="M5 20v-6m7 6V9m7 11V4" stroke-width="2.5"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M5 16v4h14v-4"/></symbol>
</defs></svg>
<svg class="landscape" viewBox="0 0 1440 280" preserveAspectRatio="none" aria-hidden="true"><defs>
 <linearGradient id="mountain-back" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#dcefe8"/><stop offset="1" stop-color="#eef7f2"/></linearGradient>
 <linearGradient id="mountain-front" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d2e6dd"/><stop offset="1" stop-color="#e9f4ed"/></linearGradient>
 <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f6fbf9" stop-opacity="0"/><stop offset="1" stop-color="#f6fbf9" stop-opacity=".8"/></linearGradient>
</defs>

<path d="M0 203C75 149 122 164 186 187S307 223 388 221 515 184 587 208 700 151 765 169 849 127 895 154 961 162 1015 138 1099 147 1155 153 1260 99 1324 122 1372 138 1440 119V280H0Z" fill="url(#mountain-front)" opacity=".58"/>
<path d="M0 229C117 187 159 231 245 237S392 221 483 247 612 234 705 237 846 198 914 220 1076 196 1178 215 1332 164 1440 183V280H0Z" fill="#dbece2" opacity=".5"/>
<path d="M0 196H1440V280H0Z" fill="url(#mist)"/>
</svg>
<svg class="leaves" viewBox="0 0 168 290" aria-hidden="true"><g fill="#adcbbb" stroke="#9dbcab" stroke-width=".6">
 <path d="M13 291Q61 196 41 95" fill="none" stroke-width="2"/>
 <path d="M42 124Q17 66 67 21Q80 69 42 124Z"/><path d="M40 154Q4 128 10 81Q46 105 40 154Z"/>
 <path d="M42 174Q61 123 102 113Q95 155 42 174Z"/><path d="M40 202Q13 162 0 173Q-1 210 40 202Z"/>
 <path d="M37 218Q64 174 114 176Q99 217 37 218Z"/><path d="M24 249Q2 208-9 224Q-5 258 24 249Z"/>
 <path d="M22 257Q55 220 89 230Q69 266 22 257Z"/>
 </g></svg>
<main class="app">
 <section class="practice" aria-label="呼吸练习">
  <header class="header">
   <div class="brand"><svg viewBox="0 0 42 36" aria-hidden="true"><path d="M2 22c8 0 8-16 14-16s8 25 15 25c5 0 6-10 10-10"/></svg><h1>呼吸</h1></div>
   <div class="header-actions"><div class="remaining-group"><span class="remaining-label">剩余</span><span id="remaining" role="timer" aria-label="练习剩余时间">10:00</span></div><span class="header-divider" aria-hidden="true"></span><button id="settings-open" class="icon-button" type="button" aria-label="练习设置" title="练习设置"><svg class="icon"><use href="#i-settings"/></svg></button></div>
  </header>
  <p class="tagline">放慢 · 感受 · 回到当下</p>
  <div class="breathing-area">
   <div class="stage" id="stage" aria-label="呼吸引导">
    <canvas id="corona" aria-hidden="true"></canvas><div class="orb-core" id="orb-core" aria-hidden="true"></div>
    <div class="orb-word"><span id="phase-label">准备</span><span id="phase-seconds" hidden></span></div>
    <span class="sr-only" id="phase-live" aria-live="polite" aria-atomic="true">准备</span>
   </div>
   <button id="rhythm-settings" class="rhythm" type="button" aria-label="修改呼吸节奏"><span id="inhale-caption">吸气 4 秒</span><i class="sep" aria-hidden="true"></i><span id="exhale-caption">呼气 6 秒</span><i class="sep" aria-hidden="true"></i><span id="hold-caption">停留 2 秒</span></button>
   <div class="actions"><button class="primary" id="toggle" type="button"><svg class="icon"><use id="toggle-icon" href="#i-play"/></svg><span id="toggle-label">开始练习</span></button><button id="reset" class="icon-button" type="button" aria-label="结束或重置练习" title="结束 / 重置" disabled><svg class="icon"><use href="#i-reset"/></svg></button></div>
  </div>
  <footer class="practice-footer">更平静的你 · 就在每一次呼吸里</footer>
 </section>
 <aside class="calendar-card" aria-label="练习日历">
  <div class="card-header"><h2>练习日历</h2><button id="all-records" class="text-button" type="button">查看全部<svg class="icon"><use href="#i-right"/></svg></button></div>
  <div class="month-nav"><button id="prev-month" class="icon-button" type="button" aria-label="上个月"><svg class="icon"><use href="#i-left"/></svg></button><button id="month-label" class="month-label" type="button" title="回到本月" aria-label="回到本月"></button><button id="next-month" class="icon-button" type="button" aria-label="下个月"><svg class="icon"><use href="#i-right"/></svg></button></div>
  <table class="calendar-table" aria-label="月历"><thead><tr><th scope="col">一</th><th scope="col">二</th><th scope="col">三</th><th scope="col">四</th><th scope="col">五</th><th scope="col">六</th><th scope="col">日</th></tr></thead><tbody id="calendar-body"></tbody></table>
  <div class="calendar-foot"><button id="daily-goal" class="calendar-legend goal-button" type="button" title="修改每日目标"><span class="legend-dot" aria-hidden="true"></span><span id="daily-goal-label">每日目标 10 分钟</span></button><button id="today-button" type="button">回到今天</button></div>
  <p id="sync-status" class="sync-status" role="status"></p>
  <section class="overview" aria-label="本月统计"><div class="overview-header"><h3>本月概览</h3><span id="streak-badge" hidden></span></div><div class="stats">
   <div class="stat"><svg class="icon" aria-hidden="true"><use href="#i-leaf"/></svg><span class="stat-value" id="stat-sessions">0</span><span class="stat-label">练习次数</span></div>
   <div class="stat"><svg class="icon" aria-hidden="true"><use href="#i-calendar"/></svg><span class="stat-value" id="stat-days">0</span><span class="stat-label">练习天数</span></div>
   <div class="stat"><svg class="icon" aria-hidden="true"><use href="#i-bars"/></svg><span class="stat-value" id="stat-minutes">0</span><span class="stat-label">总时长 / 分钟</span></div>
  </div></section>
  <blockquote class="card-quote"><p>呼吸是当下的锚，<br>也是通往内心的桥。</p><footer>— 呼吸 · 更好的自己</footer></blockquote>
 </aside>
</main>
<dialog id="settings-dialog" aria-labelledby="settings-title">
 <form id="settings-form" novalidate>
  <div class="dialog-head"><h2 id="settings-title">练习设置</h2><button class="icon-button" id="settings-close" type="button" aria-label="关闭设置"><svg class="icon"><use href="#i-close"/></svg></button></div>
  <div class="setting-row" id="row-inhale"><label class="setting-label" for="inhale-input">吸气</label><div class="stepper"><button type="button" data-step="-1" data-field="inhale" aria-label="缩短吸气时间">−</button><input id="inhale-input" name="inhale" data-key="inhale" type="number" inputmode="numeric" min="1" max="60" step="1" required aria-describedby="error-inhale"><span class="unit">秒</span><button type="button" data-step="1" data-field="inhale" aria-label="增加吸气时间">+</button></div><p class="field-error" id="error-inhale" hidden></p></div>
  <div class="setting-row" id="row-exhale"><label class="setting-label" for="exhale-input">呼气</label><div class="stepper"><button type="button" data-step="-1" data-field="exhale" aria-label="缩短呼气时间">−</button><input id="exhale-input" name="exhale" data-key="exhale" type="number" inputmode="numeric" min="1" max="60" step="1" required aria-describedby="error-exhale"><span class="unit">秒</span><button type="button" data-step="1" data-field="exhale" aria-label="增加呼气时间">+</button></div><p class="field-error" id="error-exhale" hidden></p></div>
  <div class="setting-row" id="row-hold"><label class="setting-label" for="hold-input">停留<small>每次呼气后</small></label><div class="stepper"><button type="button" data-step="-1" data-field="hold" aria-label="缩短停留时间">−</button><input id="hold-input" name="hold" data-key="hold" type="number" inputmode="numeric" min="0" max="60" step="1" required aria-describedby="error-hold"><span class="unit">秒</span><button type="button" data-step="1" data-field="hold" aria-label="增加停留时间">+</button></div><p class="field-error" id="error-hold" hidden></p></div>
  <div class="setting-row" id="row-minutes"><label class="setting-label" for="minutes-input">练习时长</label><div class="stepper"><button type="button" data-step="-1" data-field="minutes" aria-label="缩短练习时长">−</button><input id="minutes-input" name="minutes" data-key="minutes" type="number" inputmode="numeric" min="1" max="120" step="1" required aria-describedby="error-minutes"><span class="unit">分钟</span><button type="button" data-step="1" data-field="minutes" aria-label="增加练习时长">+</button></div><p class="field-error" id="error-minutes" hidden></p></div>
  <label class="toggle-row" for="countdown-input"><span>显示阶段倒计时</span><span class="switch"><input id="countdown-input" name="showCountdown" type="checkbox" role="switch"><span class="switch-track" aria-hidden="true"></span></span></label>
  <section class="cloud-settings" aria-labelledby="cloud-title">
   <div class="cloud-title-row"><h3 id="cloud-title">R2 云同步</h3><label class="switch" aria-label="启用 R2 同步"><input id="r2-enabled" type="checkbox" role="switch"><span class="switch-track" aria-hidden="true"></span></label></div>
   <div class="cloud-fields" id="cloud-fields">
    <label>应用名称<input id="r2-app" type="text" autocomplete="off" placeholder="timer"></label>
    <label>服务地址<input id="r2-url" type="url" autocomplete="url" placeholder="https://…"></label>
    <label>访问令牌<input id="r2-token" type="password" autocomplete="off"></label>
   </div>
  </section>
  <div class="dialog-actions"><button id="settings-cancel" class="secondary" type="button">取消</button><button id="settings-apply" class="primary" type="submit">应用</button></div>
 </form>
</dialog>
<dialog id="end-dialog" aria-labelledby="end-title"><div class="dialog-head"><h2 id="end-title">结束这次练习？</h2><button id="end-close" type="button" class="icon-button" aria-label="关闭"><svg class="icon"><use href="#i-close"/></svg></button></div><p class="dialog-description" id="end-description"></p><div class="dialog-actions"><button type="button" class="secondary" id="end-cancel">继续练习</button><button type="button" class="primary" id="end-confirm">结束并保存</button></div></dialog>
<dialog id="records-dialog" aria-labelledby="records-title"><div class="dialog-head"><h2 id="records-title">练习记录</h2><button id="records-close" class="icon-button" type="button" aria-label="关闭练习记录"><svg class="icon"><use href="#i-close"/></svg></button></div><div class="records-summary"><span id="records-summary"></span><button id="export-records" class="text-button" type="button"><svg class="icon"><use href="#i-download"/></svg>导出</button></div><ul class="records-list" id="records-list"></ul><div id="records-empty" class="empty-state" hidden><svg class="icon" aria-hidden="true"><use href="#i-leaf"/></svg><p id="empty-label">还没有练习记录</p><button id="records-start" class="text-button" type="button">从一次呼吸开始<svg class="icon"><use href="#i-right"/></svg></button></div></dialog>
<div id="toast" class="toast" role="status"><svg class="icon" aria-hidden="true"><use href="#i-check"/></svg><span id="toast-label"></span></div>
<a class="github-link" href="https://github.com/winglight/timer" target="_blank" rel="noopener noreferrer" aria-label="在 GitHub 上查看源码" title="在 GitHub 上查看源码"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .7a11.5 11.5 0 0 0-3.64 22.41c.58.11.79-.25.79-.56v-2.24c-3.22.7-3.9-1.37-3.9-1.37-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.71.08-.71 1.17.08 1.78 1.2 1.78 1.2 1.04 1.78 2.72 1.27 3.38.97.1-.75.4-1.27.74-1.56-2.57-.29-5.28-1.29-5.28-5.68 0-1.25.45-2.28 1.19-3.08-.12-.29-.52-1.46.11-3.04 0 0 .97-.31 3.16 1.18a10.93 10.93 0 0 1 5.76 0c2.2-1.49 3.16-1.18 3.16-1.18.63 1.58.23 2.75.11 3.04.74.8 1.19 1.83 1.19 3.08 0 4.41-2.71 5.38-5.29 5.67.42.36.79 1.07.79 2.16v3.2c0 .31.21.68.8.56A11.5 11.5 0 0 0 12 .7Z"/></svg></a>
<noscript><p style="text-align:center;padding:20px">请启用浏览器的 JavaScript 以使用呼吸计时与练习日历。</p></noscript>
<script src="engine.js"></script>
<script src="corona.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script type="module">
 import { R2Sync } from './r2-sync.js';
 window.R2Sync = R2Sync;
 await import('./app.js');
</script>
</body>
</html>

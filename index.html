<style>
html, body { min-height: 100%; margin: 0; }

.particle-ring circle { fill: rgba(144, 201, 233, var(--particle-alpha, 0.64)); }
.breath-shell.is-animating .wave-core { animation: waveFloat 4.8s ease-in-out infinite; opacity: 0.88; }
.breath-shell.is-animating .particle-ring { animation: ringPulse 3.6s ease-in-out infinite; opacity: 0.96; }
.breath-shell.is-animating .particle-ring circle { animation: particleFlicker 2.8s ease-in-out infinite; }
.breath-shell.is-paused,

.breath-shell.is-paused .particle-ring,

.calendar-grid { margin-top: 6px; }

.calendar-cell.is-other-month { opacity: 0.45; }

function t(key, values = {}) {
  return Object.entries(values).reduce((text, [name, value]) => text.replaceAll(`{${name}}`, value), translations[language][key]);
}

function phaseText(name, seconds) {
  return t(name) + seconds;
}

function applyLanguage() {
  document.documentElement.lang = language;
  document.title = t('pageTitle');
  document.querySelectorAll('[data-i18n]').forEach((element) => {

  monthTitleBtn.title = t('jumpMonthTitle');

const DEFAULT_SESSION_SECONDS = 600;
const DEFAULT_DAILY_GOAL_SECONDS = 600;

function pad(value) {
  return String(value).padStart(2, '0');
}

function formatTime(seconds) {
  const safeSeconds = Math.max(0, seconds);
  const minutes = Math.floor(safeSeconds / 60);
  const remainingSeconds = safeSeconds % 60;
  return `${pad(minutes)}:${pad(remainingSeconds)}`;
}

function formatMonthTitle(date) {
  return new Intl.DateTimeFormat(language, { year: 'numeric', month: 'long' }).format(date);
}

function formatMonthInput(date) {
  return `${date.getFullYear()}-${pad(date.getMonth() + 1)}`;
}

function formatDurationCompact(seconds) {
  const safeSeconds = Math.max(0, seconds);
  const hours = Math.floor(safeSeconds / 3600);
  const minutes = Math.floor((safeSeconds % 3600) / 60);
  const remainingSeconds = safeSeconds % 60;
  if (hours > 0) {
    return `${hours}h${pad(minutes)}`;
  }
  return `${pad(minutes)}:${pad(remainingSeconds)}`;
}

function formatDurationMinutes(seconds) {
  const safeSeconds = Math.max(0, seconds);
  return String(Math.ceil(safeSeconds / 60));
}

function formatDurationLong(seconds) {
  const safeSeconds = Math.max(0, seconds);
  const hours = Math.floor(safeSeconds / 3600);
  const minutes = Math.floor((safeSeconds % 3600) / 60);
  const remainingSeconds = safeSeconds % 60;
  const parts = [];
  if (hours > 0) parts.push(`${hours}${t('hours')}`);
  if (minutes > 0 || hours > 0) parts.push(`${minutes}${t('minutes')}`);
  parts.push(`${remainingSeconds}${t('seconds')}`);
  return parts.join(isChinese ? '' : ' ');
}

function startOfMonth(date) {
  return new Date(date.getFullYear(), date.getMonth(), 1);
}

function shiftMonth(date, offset) {
  return new Date(date.getFullYear(), date.getMonth() + offset, 1);
}

function getDateKey(date) {
  return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
}

function getInhale() {

function getExhale() {

function getPause() {

function getSettingsSnapshot() {
  return {
    inhale: getInhale(),
    exhale: getExhale(),

}

function getSessionDurationSeconds() {

}

function getDailyGoalSeconds() {

}

function isSessionDurationEditable() {

function parseDurationInput(input, fallbackSeconds) {
  if (!input) return null;
  const trimmed = input.trim();
  if (!trimmed) return null;
  const mmssMatch = trimmed.match(/^(\d{1,3}):(\d{1,2})$/);
  if (mmssMatch) {
    const minutes = Number(mmssMatch[1]);
    const seconds = Number(mmssMatch[2]);
    if (seconds >= 60) return null;
    const totalSeconds = (minutes * 60) + seconds;
    return totalSeconds > 0 ? totalSeconds : fallbackSeconds;
  }
  const minuteValue = Number(trimmed);
  if (!Number.isFinite(minuteValue) || minuteValue <= 0) {
    return null;
  }
  return Math.round(minuteValue * 60);
}

function updateTimeLeftEditState() {
  timeLeftEl.classList.toggle('is-editable', isSessionDurationEditable());
  timeLeftEl.title = isSessionDurationEditable() ? t('editDurationTitle') : '';
}

function getSettingsData(updatedAt = appSettings.updatedAt || new Date().toISOString()) {
  return {
    ...getSettingsSnapshot(),
    sessionSeconds: getSessionDurationSeconds(),
    dailyGoalSeconds: getDailyGoalSeconds(),
    updatedAt
  };
}

function applySettingsData(data) {
  if (!data || typeof data !== 'object') return;
  if (typeof data.inhale === 'number') inhaleRange.value = String(data.inhale);
  if (typeof data.exhale === 'number') exhaleRange.value = String(data.exhale);
  if (typeof data.pause === 'number') pauseRange.value = String(data.pause);
  if (typeof data.sessionSeconds === 'number' && data.sessionSeconds > 0) {
    appSettings.sessionSeconds = Math.round(data.sessionSeconds);
  }
  if (typeof data.dailyGoalSeconds === 'number' && data.dailyGoalSeconds > 0) {
    appSettings.dailyGoalSeconds = Math.round(data.dailyGoalSeconds);
  }
  if (typeof data.updatedAt === 'string') {
    appSettings.updatedAt = data.updatedAt;
  }
  inhaleVal.textContent = inhaleRange.value;
  exhaleVal.textContent = exhaleRange.value;
  pauseVal.textContent = pauseRange.value;
  if (!running) {
    pausedSessionMs = null;
    pausedPhaseMs = null;
    sessionLeft = getSessionDurationSeconds();
    remainingEl.textContent = formatTime(sessionLeft);
    const value = phase === 'inhale' ? inhaleRange.value : phase === 'exhale' ? exhaleRange.value : pauseRange.value;
    label.textContent = phaseText(phase, value);
  }
}

function getTimestampValue(value) {
  if (typeof value !== 'string') return 0;
  const time = new Date(value).getTime();
  return Number.isFinite(time) ? time : 0;
}

function getFirstString(...values) {
  return values.find((value) => typeof value === 'string' && value.trim());
}

function getFirstFiniteNumber(...values) {
  for (const value of values) {
    const number = Number(value);
    if (Number.isFinite(number)) return number;
  }
  return null;
}

function setBreathVisualScale(scale) {
  currentVisualScale = scale;
  breathShell.style.transform = `scale(${scale})`;
}

function setSyncStatus(message, tone = '') {
  syncStatus.textContent = message;
  if (tone) {
    syncStatus.dataset.tone = tone;
  } else {
    delete syncStatus.dataset.tone;
  }
}

function refreshSyncStatus() {
  if (!r2Sync.config.enabled) {
    setSyncStatus(t('cloudDisabled'));
    return;
  }
  const lastSyncedAt = localStorage.getItem(LAST_SYNC_KEY);
  if (lastSyncedAt) {
    setSyncStatus(t('cloudEnabledLast', { time: new Date(lastSyncedAt).toLocaleString(language) }), 'success');
    return;
  }
  setSyncStatus(t('cloudEnabledWaiting'), 'info');
}

function saveSettings(sync = false) {
  const data = getSettingsData(new Date().toISOString());
  appSettings.updatedAt = data.updatedAt;
  try {
    localStorage.setItem(SETTINGS_KEY, JSON.stringify(data));
  } catch (error) {
    console.error('Save settings failed:', error);
  }
  if (sync) {
    void syncSettingsToCloud();
  }
}

function loadSettings() {
  try {
    const raw = localStorage.getItem(SETTINGS_KEY);
    if (raw) {
      applySettingsData(JSON.parse(raw));
    }
  } catch (error) {
    console.error('Load settings failed:', error);
  }
}

function normalizeRecord(record) {
  if (!record || typeof record !== 'object') return null;
  const startedAt = getFirstString(
    record.startedAt,
    record.startTime,
    record.started_at,
    record.createdAt,
    record.created_at,
    record.date,
    record.timestamp
  );
  const durationSec = getFirstFiniteNumber(
    record.durationSec,
    record.durationSeconds,
    record.duration_sec,
    record.duration,
    record.seconds,
    record.elapsedSeconds
  );
  if (!startedAt || !Number.isFinite(durationSec) || durationSec <= 0) {
    return null;
  }
  const startedAtMs = new Date(startedAt).getTime();
  if (!Number.isFinite(startedAtMs)) {
    return null;
  }
  const endedAt = getFirstString(
    record.endedAt,
    record.endTime,
    record.ended_at,
    record.completedAt,
    record.completed_at
  ) || new Date(startedAtMs + (durationSec * 1000)).toISOString();
  const settings = record.settings && typeof record.settings === 'object' ? record.settings : {};
  const fallbackId = [startedAt, endedAt, durationSec, settings.inhale, settings.exhale, settings.pause].join('|');
  return {
    id: typeof record.id === 'string' && record.id ? record.id : fallbackId,
    startedAt,
    endedAt,
    durationSec: Math.round(durationSec),
    settings: {
      inhale: Number(settings.inhale) || 0,
      exhale: Number(settings.exhale) || 0,
      pause: Number(settings.pause) || 0
    },
    sessionRemainingAtStart: Number(record.sessionRemainingAtStart) || 0,
    sessionRemainingAtEnd: Number(record.sessionRemainingAtEnd) || 0,
    reason: typeof record.reason === 'string' ? record.reason : 'stop'
  };
}

function extractHistoryCandidates(payload, visited = new Set()) {
  if (!payload || typeof payload !== 'object' || visited.has(payload)) return [];
  visited.add(payload);

  if (Array.isArray(payload)) {
    return payload;
  }

  const datedRecords = Object.entries(payload).flatMap(([key, value]) => {
    if (!/^\d{4}-\d{1,2}-\d{1,2}$/.test(key) || !value || typeof value !== 'object') {
      return [];
    }
    const count = Math.max(1, Math.round(Number(value.count) || 1));
    const durationSec = Number(value.durationSec ?? value.durationSeconds ?? value.duration_sec ?? value.duration);
    if (!Number.isFinite(durationSec) || durationSec <= 0) return [];
    const perRecordDuration = Math.max(1, Math.round(durationSec / count));
    return Array.from({ length: count }, (_, index) => ({
      id: `${key}#${index + 1}`,
      startedAt: new Date(`${key}T00:00:00`).toISOString(),
      durationSec: perRecordDuration,
      reason: 'cloud-summary'
    }));
  });
  if (datedRecords.length > 0) {
    return datedRecords;
  }

  const preferredKeys = [
    HISTORY_ENTITY,
    HISTORY_KEY,
    'historyRecords',
    'records',
    'history',
    'items',
    'data',
    'todos'
  ];
  for (const key of preferredKeys) {
    const value = payload[key];
    if (!value) continue;
    const candidates = extractHistoryCandidates(value, visited);
    if (mergeHistories(candidates).length > 0) {
      return candidates;
    }
  }

  for (const value of Object.values(payload)) {
    const candidates = extractHistoryCandidates(value, visited);
    if (mergeHistories(candidates).length > 0) {
      return candidates;
    }
  }
  return [];
}

function getHistoryRecordsFromR2Result(result) {
  if (!result || !result.ok) return [];
  const payloads = [result.data];
  if (Array.isArray(result.files)) {
    result.files.forEach((file) => payloads.push(file.data));
  }
  return mergeHistories(payloads.flatMap((payload) => extractHistoryCandidates(payload)));
}

function mergeHistories(...lists) {
  const merged = new Map();
  lists.flat().forEach((item) => {
    const record = normalizeRecord(item);
    if (!record) return;
    merged.set(record.id, record);
  });
  return Array.from(merged.values()).sort((a, b) => {
    return new Date(b.startedAt).getTime() - new Date(a.startedAt).getTime();
  });
}

async function loadHistoryFromCloud() {
  const primaryResult = await r2Sync.loadFromR2(HISTORY_ENTITY);
  if (getHistoryRecordsFromR2Result(primaryResult).length > 0) {
    return primaryResult;
  }

  for (const entity of LEGACY_HISTORY_ENTITIES) {
    const legacyResult = await r2Sync.loadFromR2(entity);
    if (getHistoryRecordsFromR2Result(legacyResult).length > 0) {
      return { ...legacyResult, migratedFrom: entity };
    }
  }

  return primaryResult;
}

function loadHistoryRecords() {
  try {
    const raw = localStorage.getItem(HISTORY_KEY);
    if (!raw) return [];
    const parsed = JSON.parse(raw);
    return Array.isArray(parsed) ? mergeHistories(parsed) : [];
  } catch (error) {
    console.error('Load history failed:', error);
    return [];
  }
}

function saveHistoryRecords(records) {
  historyRecords = mergeHistories(records);
  try {
    localStorage.setItem(HISTORY_KEY, JSON.stringify(historyRecords));
  } catch (error) {
    console.error('Save history failed:', error);
  }
  renderCalendar();
}

async function syncHistoryToCloud() {
  if (!r2Sync.config.enabled) {
    refreshSyncStatus();
    return false;
  }
  setSyncStatus(t('syncingToCloud'), 'info');
  const ok = await r2Sync.syncToR2(historyRecords, HISTORY_ENTITY);
  if (ok) {
    const now = new Date().toISOString();
    localStorage.setItem(LAST_SYNC_KEY, now);
    setSyncStatus(t('cloudSyncDone', { time: new Date(now).toLocaleString(language) }), 'success');
    return true;
  } else {
    setSyncStatus(t('cloudSyncFailed'), 'error');
    return false;
  }
}

async function syncSettingsToCloud() {
  if (!r2Sync.config.enabled) {
    refreshSyncStatus();
    return false;
  }
  const data = getSettingsData();
  const ok = await r2Sync.syncToR2(data, SETTINGS_ENTITY);
  if (ok) {
    try {
      localStorage.setItem(SETTINGS_KEY, JSON.stringify(data));
    } catch (error) {
      console.error('Persist synced settings failed:', error);
    }
  }
  return ok;
}

async function hydrateSettingsFromCloud() {
  if (!r2Sync.config.enabled) {
    return false;
  }
  const result = await r2Sync.loadFromR2(SETTINGS_ENTITY);
  if (!result || result.reason === 'not_found') {
    if (appSettings.updatedAt) {
      await syncSettingsToCloud();
    }
    return false;
  }
  if (!result.ok || !result.data || typeof result.data !== 'object' || Array.isArray(result.data)) {
    return false;
  }
  const remoteSettings = result.data;
  const localTimestamp = getTimestampValue(appSettings.updatedAt);
  const remoteTimestamp = getTimestampValue(remoteSettings.updatedAt);

  if (remoteTimestamp > localTimestamp) {
    applySettingsData(remoteSettings);
    try {
      localStorage.setItem(SETTINGS_KEY, JSON.stringify(getSettingsData(appSettings.updatedAt || remoteSettings.updatedAt)));
    } catch (error) {
      console.error('Persist cloud settings failed:', error);
    }
    renderCalendar();
    return true;
  }

  if (localTimestamp > remoteTimestamp) {
    await syncSettingsToCloud();
    return true;
  }

  return false;
}

async function hydrateHistoryFromCloud() {
  if (!r2Sync.config.enabled) {
    refreshSyncStatus();
    return false;
  }
  setSyncStatus(t('loadingCloud'), 'info');
  const result = await loadHistoryFromCloud();

  if (result && result.reason === 'not_found') {
    setSyncStatus(t('cloudInitializing'), 'info');
    const initialized = await syncHistoryToCloud();
    if (initialized !== false) {
      setSyncStatus(t('cloudInitialized'), 'success');
    }
    return false;
  }

  if (!result || !result.ok) {
    if (result && result.reason === 'timeout') {
      setSyncStatus(t('cloudTimeout'), 'error');
      return false;
    }
    if (result && result.reason === 'network_error') {
      setSyncStatus(t('cloudNetwork'), 'error');
      return false;
    }
    refreshSyncStatus();
    return false;
  }
  const remoteRecords = getHistoryRecordsFromR2Result(result);
  const previousCount = historyRecords.length;
  const merged = mergeHistories(historyRecords, remoteRecords);
  const changed = JSON.stringify(merged) !== JSON.stringify(historyRecords);
  if (changed) {
    saveHistoryRecords(merged);
  } else {
    renderCalendar();
  }
  const addedCount = Math.max(0, merged.length - previousCount);
  if (result.migratedFrom) {
    setSyncStatus(t('legacyLoaded', { count: remoteRecords.length }), 'success');
  } else if (remoteRecords.length === 0) {
    const fileNames = Array.isArray(result.files) ? result.files.map((file) => file.name).join(', ') : result.filename;
    const files = fileNames ? t('fileLabel', { files: fileNames }) : '';
    setSyncStatus(t('cloudNoRecords', { files }), 'error');
  } else {
    setSyncStatus(t('cloudMerged', { remote: remoteRecords.length, added: addedCount }), 'success');
  }
  return changed;
}

function aggregateHistoryByDate() {
  const daily = {};
  historyRecords.forEach((record) => {
    const date = new Date(record.startedAt);
    if (Number.isNaN(date.getTime())) return;
    const key = getDateKey(date);
    if (!daily[key]) {
      daily[key] = { count: 0, durationSec: 0 };
    }
    daily[key].count += 1;
    daily[key].durationSec += record.durationSec;
  });
  return daily;
}

function renderCalendar() {
  const metricsByDate = aggregateHistoryByDate();
  const year = displayedMonth.getFullYear();
  const month = displayedMonth.getMonth();
  const firstDay = new Date(year, month, 1);
  const firstWeekday = firstDay.getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const daysInPrevMonth = new Date(year, month, 0).getDate();
  const today = new Date();
  const todayKey = getDateKey(today);
  const todayStart = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  const visibleCurrentMonthKeys = new Set();
  const goalSeconds = getDailyGoalSeconds();
  let monthCount = 0;
  let monthDurationSec = 0;

  monthTitleBtn.textContent = formatMonthTitle(displayedMonth);
  calendarGoal.textContent = t('dailyGoal', { minutes: Math.round(goalSeconds / 60) });
  calendarGrid.innerHTML = '';

  for (let index = 0; index < 42; index += 1) {
    const cell = document.createElement('div');
    cell.className = 'calendar-cell';
    let cellDate;
    let inCurrentMonth = true;

    if (index < firstWeekday) {
      cellDate = new Date(year, month - 1, daysInPrevMonth - firstWeekday + index + 1);
      inCurrentMonth = false;
    } else if (index >= firstWeekday + daysInMonth) {
      cellDate = new Date(year, month + 1, index - firstWeekday - daysInMonth + 1);
      inCurrentMonth = false;
    } else {
      cellDate = new Date(year, month, index - firstWeekday + 1);
    }

    const key = getDateKey(cellDate);
    if (inCurrentMonth) {
      visibleCurrentMonthKeys.add(key);
    }
    const metric = metricsByDate[key] || { count: 0, durationSec: 0 };
    const isGoalMet = metric.durationSec >= goalSeconds;
    const cellDateStart = new Date(cellDate.getFullYear(), cellDate.getMonth(), cellDate.getDate());
    const isPastOrToday = cellDateStart.getTime() <= todayStart.getTime();
    const metricParts = [];
    if (metric.count > 0) {
      metricParts.push(String(metric.count));
    }
    const minuteValue = Number(formatDurationMinutes(metric.durationSec));
    if (minuteValue > 0) {
      metricParts.push(String(minuteValue));
    }
    const metricText = metricParts.join(' | ');

    if (!inCurrentMonth) {
      cell.classList.add('is-other-month');
    } else if (isGoalMet) {
      cell.classList.add('is-goal-met');
    } else if (isPastOrToday) {
      cell.classList.add('is-goal-missed');
    }
    if (key === todayKey) {
      cell.classList.add('is-today');
    }

    cell.innerHTML = `
      <div class="date-number">${cellDate.getDate()}</div>
      <div class="calendar-metric-inline${metricText ? '' : ' is-empty'}">${metricText}</div>
    `;
    calendarGrid.appendChild(cell);
  }

  visibleCurrentMonthKeys.forEach((key) => {
    const metric = metricsByDate[key];
    if (!metric) return;
    monthCount += metric.count;
    monthDurationSec += metric.durationSec;
  });
  calendarSummary.textContent = t('monthSummary', {
    count: monthCount,
    duration: formatDurationLong(monthDurationSec)
  });
}

function beginRunRecord() {
  activeRun = {
    id: typeof crypto !== 'undefined' && crypto.randomUUID ? crypto.randomUUID() : `run-${Date.now()}`,
    startedAtMs: Date.now(),
    startedAt: new Date().toISOString(),
    settings: getSettingsSnapshot(),
    sessionRemainingAtStart: sessionLeft
  };
}

function finalizeRunRecord(reason) {
  if (!activeRun) return;
  const endedAtMs = Date.now();
  const durationSec = Math.max(1, Math.ceil((endedAtMs - activeRun.startedAtMs) / 1000));
  const record = {
    id: activeRun.id,
    startedAt: activeRun.startedAt,
    endedAt: new Date(endedAtMs).toISOString(),
    durationSec,
    settings: activeRun.settings,
    sessionRemainingAtStart: activeRun.sessionRemainingAtStart,
    sessionRemainingAtEnd: sessionLeft,
    reason
  };
  activeRun = null;
  saveHistoryRecords([...historyRecords, record]);
  void syncHistoryToCloud();
}

function ensureAudio() {
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
    // Keep one silent oscillator and gain node for the lifetime of the page.
    toneOscillator = audioCtx.createOscillator();
    toneGain = audioCtx.createGain();
    toneOscillator.type = 'sine';
    toneOscillator.frequency.value = 600;
    toneGain.gain.value = 0;
    toneOscillator.connect(toneGain);
    toneGain.connect(audioCtx.destination);
    toneOscillator.start();
  } catch (error) {
    console.error('Audio init failed:', error);
  }
}

function silenceTone() {
  if (!toneGain) return;
  const now = audioCtx.currentTime;
  toneGain.gain.cancelScheduledValues(now);
  toneGain.gain.setValueAtTime(0, now);
}

function playPhaseTone(name, remainingMs) {
  if (!toneGain || audioCtx.state !== 'running') return;
  const duration = Math.min(name === 'pause' ? 0.4 : 1.2, remainingMs / 1000);
  if (duration <= 0) return;
  const now = audioCtx.currentTime;
  silenceTone();
  toneGain.gain.setValueAtTime(0.0001, now);
  toneGain.gain.exponentialRampToValueAtTime(0.06, now + Math.min(0.03, duration / 2));
  toneGain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
  toneGain.gain.setValueAtTime(0, now + duration);
}

async function requestWakeLock() {
  if (!('wakeLock' in navigator) || wakeLock) return;
  try {
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', () => {
      wakeLock = null;
    });
  } catch (error) {
    console.warn('Screen wake lock request failed:', error);
  }
}

async function releaseWakeLock() {
  if (!wakeLock) return;
  const lock = wakeLock;
  wakeLock = null;
  try {
    await lock.release();
  } catch (error) {
    console.warn('Screen wake lock release failed:', error);
  }
}

function phaseDuration(name) {
  return (name === 'inhale' ? getInhale() : name === 'exhale' ? getExhale() : getPause()) * 1000;
}

function renderPhase(now, sound = false) {
  const remainingMs = Math.max(0, phaseDeadline - now);
  secondsLeft = Math.ceil(remainingMs / 1000);
  label.textContent = phaseText(phase, secondsLeft);
  breathShell.classList.add('is-animating');
  breathShell.classList.toggle('is-paused', phase === 'pause');
  if (phase !== 'pause') {
    breathShell.style.transitionDuration = remainingMs / 1000 + 's';
    setBreathVisualScale(phase === 'inhale' ? 1 : 0.72);
  }
  if (sound) playPhaseTone(phase, Math.min(remainingMs, sessionDeadline - now));
}

function tick() {
  if (!running) return;
  const now = performance.now();
  sessionLeft = Math.max(0, Math.ceil((sessionDeadline - now) / 1000));
  remainingEl.textContent = formatTime(sessionLeft);
  if (sessionLeft <= 0) {
    finish();
    return;
  }
  let changed = false;
  // Advance from the previous deadline, not the callback time. Late callbacks
  // skip obsolete cues instead of queuing sounds or accumulating timer drift.
  while (now >= phaseDeadline) {
    if (phase === 'pause') {
      phase = nextAfterPause || 'inhale';
      nextAfterPause = null;
    } else if (getPause() > 0) {
      nextAfterPause = phase === 'inhale' ? 'exhale' : 'inhale';
      phase = 'pause';
    } else {
      phase = phase === 'inhale' ? 'exhale' : 'inhale';
    }
    phaseDeadline += phaseDuration(phase);
    changed = true;
  }
  if (changed) {
    renderPhase(now, true);
  } else {
    secondsLeft = Math.ceil((phaseDeadline - now) / 1000);
    label.textContent = phaseText(phase, secondsLeft);
  }
}

async function start() {
  if (running || starting) return;
  starting = true;
  const request = ++startRequest;
  toggleBtn.textContent = t('stop');
  ensureAudio();
  try {
    // Resume inside the click gesture; do not start the clock while audio wakes up.
    if (audioCtx && audioCtx.state !== 'running') await audioCtx.resume();
  } catch (error) {
    console.warn('Audio resume failed:', error);
  }
  if (request !== startRequest) return;
  starting = false;
  if (sessionLeft <= 0) {
    sessionLeft = getSessionDurationSeconds();
    phase = 'inhale';
    nextAfterPause = null;
    pausedSessionMs = null;
    pausedPhaseMs = null;
  }
  const now = performance.now();
  sessionDeadline = now + (pausedSessionMs ?? sessionLeft * 1000);
  phaseDeadline = now + (pausedPhaseMs ?? phaseDuration(phase));
  pausedSessionMs = null;
  pausedPhaseMs = null;
  beginRunRecord();
  running = true;
  renderPhase(now, true);
  remainingEl.textContent = formatTime(sessionLeft);
  updateTimeLeftEditState();
  renderCalendar();
  void requestWakeLock();
  timer = window.setInterval(tick, 50);

  if (typeof gtag === 'function') {
    gtag('event', 'start_practice', {
      inhale: getInhale(),
      exhale: getExhale(),
      pause: getPause()
    });
  }
}

function stop(reason = 'stop') {
  ++startRequest;
  starting = false;
  toggleBtn.textContent = t('start');
  if (!running && !activeRun) return;
  const now = performance.now();
  pausedSessionMs = Math.max(0, sessionDeadline - now);
  pausedPhaseMs = Math.max(0, phaseDeadline - now);
  sessionLeft = Math.ceil(pausedSessionMs / 1000);
  remainingEl.textContent = formatTime(sessionLeft);
  // Freeze the current scale so resuming animates only the remaining phase.
  const transform = getComputedStyle(breathShell).transform;
  breathShell.style.transitionDuration = '0s';
  breathShell.style.transform = transform;
  running = false;
  silenceTone();
  void releaseWakeLock();
  toggleBtn.textContent = t('start');
  if (timer) {
    clearInterval(timer);
    timer = null;
  }
  breathShell.classList.remove('is-paused');
  breathShell.classList.remove('is-animating');
  finalizeRunRecord(reason);
  updateTimeLeftEditState();
  renderCalendar();

  if (typeof gtag === 'function') {
    gtag('event', 'stop_practice', {
      remaining_seconds: sessionLeft
    });
  }
}

function finish() {
  stop('finish');
  label.textContent = t('complete');
  breathShell.style.transitionDuration = '0.5s';
  setBreathVisualScale(1);
  remainingEl.textContent = '00:00';

  if (typeof gtag === 'function') {
    gtag('event', 'complete_practice');
  }
}

function generateWaves() {
  const size = 360;
  const centerX = size / 2;
  const centerY = size / 2;
  const baseRadius = 146;
  const maxWaveHeight = 6;
  const segments = 48;
  const points = [];

  for (let index = 0; index < segments; index += 1) {
    const angle = (index / segments) * Math.PI * 2;
    const waveOffset = (Math.cos(angle * 4) * maxWaveHeight) + (Math.cos(angle * 8) * 2);
    const radius = baseRadius + waveOffset;

    points.push({
      angle,
      radius,
      x: centerX + Math.cos(angle) * radius,
      y: centerY + Math.sin(angle) * radius
    });
  }

  const midPoints = [];
  for (let index = 0; index < points.length; index += 1) {
    const pointA = points[index];
    const pointB = points[(index + 1) % points.length];
    midPoints.push({
      x: (pointA.x + pointB.x) / 2,
      y: (pointA.y + pointB.y) / 2
    });
  }

  let d = `M ${midPoints[0].x} ${midPoints[0].y}`;
  for (let index = 0; index < points.length; index += 1) {
    const controlPoint = points[(index + 1) % points.length];
    const destination = midPoints[(index + 1) % midPoints.length];
    d += ` Q ${controlPoint.x} ${controlPoint.y}, ${destination.x} ${destination.y}`;
  }

  wavePath.setAttribute('d', d);
  particleRing.innerHTML = '';
  const particleLayers = [
    { radius: 130, count: 24, size: 4.4, opacity: 0.78, delayStep: 0.09, offset: 0 },
    { radius: 140, count: 30, size: 3.5, opacity: 0.66, delayStep: 0.075, offset: 0.14 },
    { radius: 150, count: 36, size: 2.7, opacity: 0.52, delayStep: 0.06, offset: 0.08 },
    { radius: 158, count: 42, size: 2.1, opacity: 0.38, delayStep: 0.05, offset: 0.2 }
  ];

  particleLayers.forEach((layer, layerIndex) => {
    for (let index = 0; index < layer.count; index += 1) {
      const particle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      const angle = ((index / layer.count) * Math.PI * 2) + layer.offset;
      const wobble = Math.cos(angle * 4) * (layerIndex * 0.45);
      particle.setAttribute('cx', String(centerX + Math.cos(angle) * (layer.radius + wobble)));
      particle.setAttribute('cy', String(centerY + Math.sin(angle) * (layer.radius + wobble)));
      particle.setAttribute('r', String(layer.size));
      particle.style.setProperty('--particle-alpha', String(layer.opacity));
      particle.style.animationDelay = `${(index + (layerIndex * 2)) * layer.delayStep}s`;
      particleRing.appendChild(particle);
    }
  });
}

function trackSettingChange(setting, value) {
  if (typeof gtag === 'function') {
    gtag('event', 'update_setting', {
      setting_name: setting,
      value
    });
  }
}

function jumpToMonth() {
  const input = window.prompt(t('monthPrompt'), formatMonthInput(displayedMonth));
  if (!input) return;
  const match = input.trim().match(/^(\d{4})-(\d{1,2})$/);
  if (!match) {
    window.alert(t('invalidMonthFormat'));
    return;
  }
  const year = Number(match[1]);
  const month = Number(match[2]);
  if (month < 1 || month > 12) {
    window.alert(t('invalidMonth'));
    return;
  }
  displayedMonth = new Date(year, month - 1, 1);
  renderCalendar();
}

function editSessionDuration() {
  if (!isSessionDurationEditable()) return;
  const input = window.prompt(t('durationPrompt'), formatTime(Math.max(sessionLeft, getSessionDurationSeconds())));
  if (!input) return;
  const parsedSeconds = parseDurationInput(input, getSessionDurationSeconds());
  if (!parsedSeconds) {
    window.alert(t('invalidDuration'));
    return;
  }
  appSettings.sessionSeconds = parsedSeconds;
  pausedSessionMs = null;
  sessionLeft = parsedSeconds;
  remainingEl.textContent = formatTime(sessionLeft);
  saveSettings(true);
}

function editDailyGoal() {
  const input = window.prompt(t('goalPrompt'), String(Math.round(getDailyGoalSeconds() / 60)));
  if (!input) return;
  const minutes = Number(input.trim());
  if (!Number.isFinite(minutes) || minutes <= 0) {
    window.alert(t('invalidGoal'));
    return;
  }
  appSettings.dailyGoalSeconds = Math.round(minutes * 60);
  saveSettings(true);
  renderCalendar();
}

toggleBtn.addEventListener('click', () => {
  if (!running && !starting) {
    void start();
  } else {
    stop('stop');
  }
});

configBtn.addEventListener('click', () => {
  r2Sync.createConfigDialog(async () => {
    await hydrateSettingsFromCloud();
    const mergedFromCloud = await hydrateHistoryFromCloud();
    await syncSettingsToCloud();
    if (historyRecords.length > 0 || mergedFromCloud) {
      await syncHistoryToCloud();
    } else {
      refreshSyncStatus();
    }
  }, {
    title: t('r2Title'),
    enable: t('r2Enable'),
    app: t('r2App'),
    url: t('r2Url'),
    token: t('r2Token'),
    save: t('save'),
    close: t('close')
  });
});

prevMonthBtn.addEventListener('click', () => {
  displayedMonth = shiftMonth(displayedMonth, -1);
  renderCalendar();
});

nextMonthBtn.addEventListener('click', () => {
  displayedMonth = shiftMonth(displayedMonth, 1);
  renderCalendar();
});

monthTitleBtn.addEventListener('click', jumpToMonth);
timeLeftEl.addEventListener('dblclick', editSessionDuration);
calendarGoal.addEventListener('dblclick', editDailyGoal);

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && running) {
    tick();
    if (running) void requestWakeLock();
  }
});

inhaleRange.addEventListener('input', () => {
  inhaleVal.textContent = inhaleRange.value;
  saveSettings();
  if (!running && sessionLeft > 0 && phase === 'inhale') {
    label.textContent = phaseText('inhale', inhaleRange.value);
  }
});

exhaleRange.addEventListener('input', () => {
  exhaleVal.textContent = exhaleRange.value;
  saveSettings();
  if (!running && sessionLeft > 0 && phase === 'exhale') {
    label.textContent = phaseText('exhale', exhaleRange.value);
  }
});

pauseRange.addEventListener('input', () => {
  pauseVal.textContent = pauseRange.value;
  saveSettings();
  if (!running && sessionLeft > 0 && phase === 'pause') {
    label.textContent = phaseText('pause', pauseRange.value);
  }
});

inhaleRange.addEventListener('change', () => {
  saveSettings(true);
  trackSettingChange('inhale', getInhale());
});
exhaleRange.addEventListener('change', () => {
  saveSettings(true);
  trackSettingChange('exhale', getExhale());
});
pauseRange.addEventListener('change', () => {
  saveSettings(true);
  trackSettingChange('pause', getPause());
});

async function init() {
  applyLanguage();
  ensureAudio();
  loadSettings();
  remainingEl.textContent = formatTime(sessionLeft);
  label.textContent = phaseText('inhale', inhaleRange.value);
  generateWaves();
  setBreathVisualScale(0.72);
  updateTimeLeftEditState();
  renderCalendar();
  refreshSyncStatus();
  await hydrateSettingsFromCloud();
  const mergedFromCloud = await hydrateHistoryFromCloud();
  if (mergedFromCloud && historyRecords.length > 0) {
    await syncHistoryToCloud();
  }
}

void init();
</script>
</body>
</html>

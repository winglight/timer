name: Ambient WebGL regression
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Unit and source regression tests
        run: node --test tests/*.test.cjs
      - name: Install browser test dependencies
        run: |
          python -m pip install -r tests/requirements-webgl.txt
          python -m playwright install --with-deps chromium
      - name: Compile and render all production scenes
        run: python tests/webgl-smoke.py
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: ambient-webgl-results
          path: .webgl-results/
          retention-days: 7
